<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>My Planner</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><h1>My Planner</h1><p>School & personal tasks · Stored on this device</p></div><button id="themeBtn" class="secondary" aria-label="Toggle theme">◐</button></header><section class="stats"><article><span>Progress</span><strong id="overall">0%</strong><div class="bar"><i id="overallBar"></i></div></article><article><span>Pending</span><strong id="pending">0</strong><small id="dueSoon">0 due soon</small></article></section><section class="toolbar"><select id="filter"><option value="all">All categories</option></select><select id="statusFilter"><option value="active">Active</option><option value="all">All tasks</option><option value="completed">Completed</option></select><button id="newBtn">+ Add task</button></section><section class="tasks"><div class="sectionTitle"><h2>Tasks</h2><span id="taskCount"></span></div><div id="taskList"></div></section><section class="manage"><h2>Customize</h2><div class="manageRow"><input id="categoryName" placeholder="New category / subject" maxlength="60"><input id="categoryColor" type="color" value="#6366f1" aria-label="Category color"><button id="addCategory">Add</button></div><div id="categoryList"></div></section><section class="backup"><h2>Backup & restore</h2><p>Data stays in this browser. Export a backup regularly, especially before clearing Safari website data.</p><div class="actions"><button id="exportBtn" class="secondary">Export JSON</button><label class="button secondary" for="importFile">Import JSON</label><input id="importFile" type="file" accept="application/json,.json" hidden><button id="clearBtn" class="danger">Delete all data</button></div></section><footer>Local-only · No account · No cloud sync</footer></main><dialog id="taskDialog"><form id="taskForm"><div class="dialogHead"><h2 id="dialogTitle">New task</h2><button type="button" id="closeDialog" class="secondary">✕</button></div><input type="hidden" id="taskId"><label>Title<input id="title" maxlength="140" required placeholder="What needs to get done?"></label><label>Notes<textarea id="notes" rows="3" placeholder="Optional details"></textarea></label><div class="two"><label>Category<select id="taskCategory"></select></label><label>Priority<select id="priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></label></div><label>Deadline<input id="deadline" type="date"></label><label>Progress <output id="progressOutput">0%</output><input id="progress" type="range" min="0" max="100" step="5" value="0"></label><label>Subtasks (one per line)<textarea id="subtasks" rows="4" placeholder="Research\nWrite draft\nSubmit"></textarea></label><div class="actions"><button type="submit">Save task</button><button type="button" id="deleteTask" class="danger" hidden>Delete</button></div></form></dialog><script src="script.js" defer></script></body></html>
